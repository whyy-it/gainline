name: Rebuild site

# Started 21 Nov as just the daily World Rugby player-stats pull; now (22 Nov) runs the FULL rebuild every
# time, because the Matches tab no longer has a hand-maintained fixture list to gate on - auto_rounds.py
# detects every tracked competition's current fixtures straight from ESPN each run (see model/README.md,
# "we need this to update automatically"), so a new round appearing is itself a reason to republish, not
# just new player stats. Match RESULTS (games.parquet) stay a manual step via espn_catchup.py by design -
# those feed win probabilities and the Bets tab and are meant to be reviewed before they change what every
# model is built on (see CLAUDE.md/README).
# Always computes everything, but only commits/pushes if the output actually changed and verify_site.py's
# checks all pass - a quiet day (nothing new to sync, same fixtures as last run) is a clean no-op.
# Also rebuilds grades_archive/ every run (23 Nov) - one small JSON per match we have full player-stats data
# for (~4,700 of them), so the Grades tab's match picker can browse any game, not just the current round.

on:
  schedule:
    # Off the top of the hour on purpose - every repo whose owner picked a round "6am" cron also lands on
    # 0 6 * * *, so GitHub's shared scheduler queue is busiest exactly there. An odd minute avoids that
    # pileup (found 22 Nov: the first real run fired at 13:51 UTC instead of 06:00 - a ~8h delay).
    - cron: '17 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull new World Rugby match/player data
        working-directory: model
        run: python3 wr_stats_sync.py

      - name: Merge into player_stats.parquet / team_match_stats.parquet
        working-directory: model
        run: python3 wr_stats_merge.py

      - name: Rebuild site.json (auto-detects this week's fixtures + any new player stats)
        working-directory: model
        run: python3 produce.py

      - name: Rebuild grades_archive/ (every match we have full player-stats data for, ~165-210s)
        working-directory: model
        run: python3 grades_archive.py

      - name: Rebuild site/gainline.html + index.html
        run: python3 build_site.py

      - name: Verify (26 checks must pass before anything is published)
        working-directory: model
        run: python3 verify_site.py

      - name: Check whether anything actually changed
        id: changed
        run: |
          if git diff --quiet; then
            echo "Nothing changed - same fixtures/stats as last run. Nothing to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Automated rebuild ($(date -u +%Y-%m-%d))"
          git push origin HEAD:main
