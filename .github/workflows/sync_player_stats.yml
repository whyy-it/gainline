name: Sync player stats

# Daily pull from World Rugby's Pulse API (model/wr_stats_sync.py + wr_stats_merge.py - see model/README.md
# for how/why this source was chosen and the identity-reconciliation fix it needed). Only touches
# player_stats.parquet/team_match_stats.parquet (Grades/Rankings/Recap) - match RESULTS stay a manual step
# via espn_catchup.py by design, since those feed win probabilities and the Bets tab and are meant to be
# reviewed before they change what every model is built on (see CLAUDE.md/README).
# Rebuilds and pushes the live site only if verify_site.py's 23 checks all pass; a no-new-matches day (most
# days, between rounds) is a clean no-op - nothing is committed.

on:
  schedule:
    # Off the top of the hour on purpose - every repo whose owner picked a round "6am" cron also lands on
    # 0 6 * * *, so GitHub's shared scheduler queue is busiest exactly there. An odd minute avoids that
    # pileup (found 22 Nov: the first real run fired at 13:51 UTC instead of 06:00 - a ~8h delay).
    - cron: '17 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull new World Rugby match/player data
        working-directory: model
        run: python3 wr_stats_sync.py

      - name: Merge into player_stats.parquet / team_match_stats.parquet
        working-directory: model
        run: python3 wr_stats_merge.py

      - name: Check whether the merge changed anything
        id: changed
        run: |
          if git diff --quiet -- model/player_stats.parquet model/team_match_stats.parquet; then
            echo "No new matches today - nothing to rebuild or publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild site.json
        if: steps.changed.outputs.changed == 'true'
        working-directory: model
        run: python3 produce.py

      - name: Rebuild site/gainline.html + index.html
        if: steps.changed.outputs.changed == 'true'
        run: python3 build_site.py

      - name: Verify (23/23 checks must pass before anything is published)
        if: steps.changed.outputs.changed == 'true'
        working-directory: model
        run: python3 verify_site.py

      - name: Commit and push
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Automated: sync World Rugby player stats ($(date -u +%Y-%m-%d))"
          git push origin HEAD:main
